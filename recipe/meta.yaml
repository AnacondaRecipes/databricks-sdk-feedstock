{% set name = "databricks-sdk" %}
{% set version = "0.104.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
    sha256: 527c35aac3a28665a7933f34b7dd0c1bd6e9450a487f2c02fcfb6dce72ca82c9
  - url: https://github.com/databricks/{{ name }}-py/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 7ecfea77ed0aada6e436d314416812151ed84d1a47795762bf8fcf701e3921fb
    folder: gh_src

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=42
    - protobuf
  run:
    - python
    - requests >=2.28.1,<3
    - google-auth >=2.0,<3
    - protobuf >=4.25.8,!=5.26.*,!=5.27.*,!=5.28.*,!=5.29.0,!=5.29.1,!=5.29.2,!=5.29.3,!=5.29.4,!=6.30.0,!=6.30.1,!=6.31.0,<7.0
  run_constrained:
    - ipython >=8,<10
    - ipywidgets >=8,<9

{% set tests_to_skip = " test_init_file_contents" %}
{% set tests_to_skip = tests_to_skip + " or test_open_ai_client" %}
{% set tests_to_skip = tests_to_skip + " or test_langchain_open_ai_client" %}
{% set tests_to_skip = tests_to_skip + " or test_get_open_ai_client_deprecation_warning" %}
{% set tests_to_skip = tests_to_skip + " or test_get_langchain_chat_open_ai_client_deprecation_warning" %}
test:
  source_files:
    - gh_src/tests
  imports:
    - databricks
    - databricks.sdk
  requires:
    - pip
    - pytest
    - pytest-xdist
    - pytest-mock
    - pyfakefs
    - requests-mock
  commands:
    - pip check
    - cd gh_src
    # test_init_file_contents: verifies hash of databricks/__init__.py, not relevant for us.
    # test_open_ai_client, test_langchain_open_ai_client, test_get_open_ai_client_deprecation_warning,
    # test_get_langchain_chat_open_ai_client_deprecation_warning: require openai/httpx optional deps not installed.
    - pytest tests -vv -m "not integration and not benchmark" -k "not ({{ tests_to_skip }})"

about:
  home: https://github.com/databricks/databricks-sdk-py
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - NOTICE
  summary: Databricks SDK for Python (Experimental)
  description: |
    The Databricks SDK for Python includes functionality to accelerate development with Python for the Databricks Lakehouse.
    It covers all public Databricks REST API operations.
  doc_url: https://databricks-sdk-py.readthedocs.io
  dev_url: https://github.com/databricks/databricks-sdk-py

extra:
  recipe-maintainers:
    - jasongrout-db
    - nfx
    - monaldoj
